name: Build test artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse

      - name: Create test output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          "GitHub Actions is working." | Out-File -FilePath output\test.txt -Encoding utf8
          "plugin.cpp exists: $(Test-Path plugin.cpp)" | Out-File -FilePath output\check.txt -Append -Encoding utf8
          "README.md exists: $(Test-Path README.md)" | Out-File -FilePath output\check.txt -Append -Encoding utf8
          "CMakeLists.txt exists: $(Test-Path CMakeLists.txt)" | Out-File -FilePath output\check.txt -Append -Encoding utf8
          "CMakeLists.txt.txt exists: $(Test-Path CMakeLists.txt.txt)" | Out-File -FilePath output\check.txt -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepmark-test-artifact
          path: output/
